name: LMI MIUI Kernel Build (Follow Official README)
run-name: Build lmi kernel ${{ github.sha }}
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: read

env:
  DEVICE: lmi
  PR_NUM: 56
  CLANG_ZIP_TAG: 20210522
  TOOLCHAIN_ROOT: proton-clang
  TOOLCHAIN_FOLDER: proton-clang-${{ env.CLANG_ZIP_TAG }}
  CCACHE_DIR: $HOME/.cache/ccache_mikernel

jobs:
  compile:
    runs-on: ubuntu-22.04
    steps:
      # 1. 严格按照 README 安装 Debian/Ubuntu 全套依赖
      - name: Install official build dependencies
        run: |
          sudo apt update -y
          sudo apt install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3
          # 配置 ccache 缓存目录，和 build.sh 保持一致
          mkdir -p ${{ env.CCACHE_DIR }}
          echo "CCACHE_DIR=${{ env.CCACHE_DIR }}" >> $GITHUB_ENV

      # 2. 拉取内核源码
      - name: Clone kernel source repo
        run: |
          git clone https://github.com/liyafe1997/kernel_xiaomi_sm8250_mod kernel
          cd kernel
          git config user.name "CI Builder"
          git config user.email "ci@github.ci"

      # 3. 合并 PR#56，仅自动修复 README.md 冲突
      - name: Merge PR #${{ env.PR_NUM }} auto resolve README conflict
        run: |
          cd kernel
          git fetch origin pull/${{ env.PR_NUM }}/head:pr${{ env.PR_NUM }}
          git merge pr${{ env.PR_NUM }} -m "Merge PR #${{ env.PR_NUM }}" || true
          conflict_files=$(git ls-files -u)
          if [ -n "$conflict_files" ]; then
            echo "Conflict detected, only keep main branch README.md"
            git checkout --ours README.md
            git add README.md
            remaining_conflict=$(git ls-files -u)
            if [ -n "$remaining_conflict" ]; then
              echo "::error::Other source code conflict found, exit build: $remaining_conflict"
              exit 1
            fi
            git commit -m "Merge PR#${{ env.PR_NUM }} auto fix README conflict"
          fi
          git branch -D pr${{ env.PR_NUM }}

      # 4. 缓存固定版本 proton-clang，加速重复构建
      - name: Cache proton-clang 20210522
        uses: actions/cache@v3
        with:
          path: kernel/${{ env.TOOLCHAIN_ROOT }}
          key: proton-clang-${{ env.CLANG_ZIP_TAG }}-lmi

      # 5. 严格按 README 下载指定 tag 工具链 20210522
      - name: Download proton-clang 20210522 (document specified version)
        run: |
          cd kernel
          if [ ! -d ${{ env.TOOLCHAIN_ROOT }}/${{ env.TOOLCHAIN_FOLDER }} ]; then
            mkdir -p ${{ env.TOOLCHAIN_ROOT }}
            cd ${{ env.TOOLCHAIN_ROOT }}
            wget https://github.com/kdrag0n/proton-clang/archive/refs/tags/${{ env.CLANG_ZIP_TAG }}.zip
            unzip ${{ env.CLANG_ZIP_TAG }}.zip
            rm -f ${{ env.CLANG_ZIP_TAG }}.zip
            cd ..
          fi
          # 把工具链 bin 写入环境变量 PATH，匹配 build.sh 路径规则
          echo "PATH=$PWD/${{ env.TOOLCHAIN_ROOT }}/${{ env.TOOLCHAIN_FOLDER }}/bin:$PATH" >> $GITHUB_ENV

      # 6. 使用官方 build.sh 编译 lmi 内核（完全对齐本地手动构建命令）
      - name: Build kernel via official build.sh (no KernelSU)
        run: |
          cd kernel
          bash build.sh ${{ env.DEVICE }}

      # 7. 拉取 AnyKernel3 打包模板
      - name: Prepare AnyKernel3 packaging
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 anykernel3
          cd anykernel3
          rm -rf Image Image.gz Image.gz-dtb dtbo.img dtb modules ramdisk

      # 8. 复制编译输出产物至刷机包（适配 lmi SM8250 MIUI）
      - name: Copy kernel output to AnyKernel3
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel3/
          mkdir -p anykernel3/dtb
          cp -r kernel/out/arch/arm64/boot/dts/vendor/xiaomi/lmi/* anykernel3/dtb/
          cp kernel/out/arch/arm64/boot/dtbo.img anykernel3/
          mkdir -p anykernel3/modules
          find kernel/out/modules/lib/modules -name "*.ko" -exec cp {} anykernel3/modules/ \;

      # 9. 生成刷机 ZIP 包并设置 Release 变量
      - name: Generate flashable zip
        run: |
          cd anykernel3
          ZIP_NAME=LMI-MIUI-Kernel-PR${{ env.PR_NUM }}-${{ github.sha }}.zip
          zip -r9 $ZIP_NAME *
          mv $ZIP_NAME ../
          echo "ZIP_FILE=$ZIP_NAME" >> $GITHUB_ENV
          echo "RELEASE_TAG=LMI-Kernel-${{ github.sha }}" >> $GITHUB_ENV
          echo "RELEASE_TITLE=Redmi K30 Pro(lmi) MIUI Kernel PR#${{ env.PR_NUM }}" >> $GITHUB_ENV

      # 10. 自动发布 GitHub Release
      - name: Publish Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body: |
            ## Build Info
            - Device: lmi (Redmi K30 Pro / POCO F2 Pro)
            - Build Script: Official repo build.sh lmi
            - Toolchain: proton-clang tag 20210522 (README specified version)
            - Merged PR: #${{ env.PR_NUM }}
            - Ccache enabled, cache dir: ${{ env.CCACHE_DIR }}
            - Compile Method: Fully follow repository README guide
            ## Flash Instruction
            Flash via TWRP/OrangeFox, native MIUI compatible.
          files: ${{ env.ZIP_FILE }}
          draft: false
          prerelease: false
