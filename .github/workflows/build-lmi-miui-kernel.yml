name: Build LMI MIUI Kernel
run-name: LMI MIUI Kernel Build ${{ github.sha }}
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: read

env:
  KERNEL_REPO: liyafe1997/kernel_xiaomi_sm8250_mod
  DEVICE: lmi
  DEFCONFIG: lmi_defconfig
  PR_TARGET: 56
  ARCH: arm64
  OUT: out
  # 仓库README指定工具链
  TC_REPO: kdrag0n/proton-clang
  TC_DIR: clang

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Dependencies (match README)
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y git zip unzip build-essential libssl-dev bc flex bison python3 cpio libelf-dev libncurses-dev gcc-aarch64-linux-gnu

      - name: Clone Kernel Source
        run: |
          git clone https://github.com/${{ env.KERNEL_REPO }} kernel
          cd kernel
          git config --global user.name "CI Builder"
          git config --global user.email "ci@build.local"

      - name: Merge PR #${{ env.PR_TARGET }} auto fix README conflict
        run: |
          cd kernel
          git fetch origin pull/${{ env.PR_TARGET }}/head:pr${{ env.PR_TARGET }}
          git merge pr${{ env.PR_TARGET }} -m "Merge PR${{ env.PR_TARGET }}" || true
          # Only resolve README.md conflict with main branch version
          if [[ -n $(git ls-files -u) ]]; then
            git checkout --ours README.md
            git add README.md
            local conflicts=$(git ls-files -u)
            if [[ -n $conflicts ]]; then
              echo "::error::Other file merge conflict exist: $conflicts"
              exit 1
            fi
            git commit -m "Merge PR${{ env.PR_TARGET }} auto resolve README conflict"
          fi

      - name: Cache Toolchain
        uses: actions/cache@v3
        with:
          path: kernel/${{ env.TC_DIR }}
          key: ${{ env.TC_REPO }}-13-${{ env.DEVICE }}

      - name: Download Proton Clang 13 (compatible version from repo doc)
        run: |
          cd kernel
          if [ ! -d ${{ env.TC_DIR }} ]; then
            git clone --depth=1 https://github.com/${{ env.TC_REPO }} ${{ env.TC_DIR }}
            cd ${{ env.TC_DIR }}
            git checkout 13
            cd ..
          fi
          echo "PATH=$PWD/${{ env.TC_DIR }}/bin:$PATH" >> $GITHUB_ENV

      - name: Build Kernel (100% follow README compile order)
        run: |
          cd kernel
          make clean O=${{ env.OUT }}
          make mrproper O=${{ env.OUT }}
          # Step1 generate defconfig
          make ${{ env.DEFCONFIG }} O=${{ env.OUT }} ARCH=${{ env.ARCH }} CC=clang
          # Step2 full compile params same as repo readme
          make -j$(nproc) O=${{ env.OUT }} \
            ARCH=${{ env.ARCH }} \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1

      - name: Clone AnyKernel3 (repo standard packaging method)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 anykernel
          cd anykernel
          rm -rf Image.gz-dtb dtbo.img dtb modules

      - name: Copy kernel binary & DTB/DTBO per README
        run: |
          # Kernel image
          cp kernel/${{ env.OUT }}/arch/${{ env.ARCH }}/boot/Image.gz-dtb anykernel/
          # Device tree for lmi
          mkdir -p anykernel/dtb
          cp -r kernel/${{ env.OUT }}/arch/${{ env.ARCH }}/boot/dts/vendor/xiaomi/lmi/* anykernel/dtb/
          # DTBO image required for MIUI
          cp kernel/${{ env.OUT }}/arch/${{ env.ARCH }}/boot/dtbo.img anykernel/
          # Copy kernel modules
          mkdir -p anykernel/modules
          find kernel/${{ env.OUT }}/modules/lib/modules -name "*.ko" -exec cp {} anykernel/modules/ \;

      - name: Generate Flashable ZIP
        run: |
          cd anykernel
          ZIP_NAME=LMI-MIUI-Kernel-PR${{ env.PR_TARGET }}-${{ github.sha }}.zip
          zip -r9 $ZIP_NAME *
          mv $ZIP_NAME ../
          echo "ZIP_FILE=$ZIP_NAME" >> $GITHUB_ENV
          echo "RELEASE_TAG=LMI-Kernel-${{ github.sha }}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: LMI Redmi K30 Pro MIUI Kernel (Merged PR#${{ env.PR_TARGET }})
          body: |
            # Build Info
            - Device: lmi (Redmi K30 Pro MIUI)
            - Kernel Source: https://github.com/${{ env.KERNEL_REPO }}
            - Merged PR: #${{ env.PR_TARGET }}
            - Toolchain: Proton Clang 13
            - Build Commit: ${{ github.sha }}
            - Compile Rule: Fully follow repository README.md
            # Instructions
            Flash via TWRP/OrangeFox, compatible with official MIUI.
          files: ${{ env.ZIP_FILE }}
          draft: false
          prerelease: false
