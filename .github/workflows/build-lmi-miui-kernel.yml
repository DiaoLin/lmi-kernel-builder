name: Build lmi MIUI+AOSP Kernel With SukiSU(KSU)
run-name: LMI Dual Kernel KSU Build ${{ github.sha }}
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: read

jobs:
  build_kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      # 1. 完整依赖 + 2G Swap
      - name: Install Full Build Dependencies & Swap
        run: |
          sudo apt update -y
          sudo apt install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3
          sudo apt install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          mkdir -p $HOME/.cache/ccache_mikernel
          echo "CCACHE_DIR=$HOME/.cache/ccache_mikernel" >> $GITHUB_ENV
          sudo fallocate -l 2G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      # 2. 克隆内核源码到 kernel 文件夹
      - name: Clone Kernel Source Repo
        run: |
          git clone https://github.com/liyafe1997/kernel_xiaomi_sm8250_mod kernel
          cd kernel
          git config user.name "Kernel-CI-Bot"
          git config user.email "ci@github.com"

      # 3. 合并PR#56，仅自动修复README.md冲突
      - name: Merge PR #56 Auto Fix README Conflict
        run: |
          cd kernel
          git fetch origin pull/56/head:pr56
          git merge pr56 -m "Merge PR #56" || true
          conflict_list=$(git ls-files -u)
          if [[ -n "$conflict_list" ]]; then
            echo "==== 检测到代码冲突 ===="
            echo "仅保留主线README.md文件"
            git checkout --ours README.md
            git add README.md
            remaining_conflict=$(git ls-files -u)
            if [[ -n "$remaining_conflict" ]]; then
              echo "::error::存在内核源码冲突，终止构建：$remaining_conflict"
              exit 1
            fi
            git commit -m "Merge PR#56 | Auto fixed README conflict only"
          fi
          git branch -D pr56

      # 4. 缓存工具链与CCACHE
      - name: Cache Toolchain & CCACHE
        uses: actions/cache@v3
        with:
          path: |
            kernel/proton-clang
            $HOME/.cache/ccache_mikernel
          key: mikernel-clang-20210522-lmi-ksu-dual

      # 5. 下载 proton-clang 工具链
      - name: Download Proton-Clang & Fix Path Mapping
        run: |
          cd kernel
          if [ ! -d proton-clang/proton-clang-20210522 ]; then
            mkdir -p proton-clang
            cd proton-clang
            wget https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip
            unzip -q 20210522.zip
            rm -f 20210522.zip
            cd ..
          fi
          ln -sf $PWD/proton-clang $HOME/proton-clang
          echo "PATH=$HOME/proton-clang/proton-clang-20210522/bin:$PATH" >> $GITHUB_ENV

      # 6. 编译脚本，正确拼接完整仓库路径（修复核心）
      - name: Run Official Build Script (Output Dual Zip)
        timeout-minutes: 200
        run: |
          cd kernel
          bash build.sh lmi ksu
          echo "==================== 全部生成刷机包列表 ===================="
          ls -la ./*.zip

          # 重置变量，逐一生成完整路径 kernel/xxx.zip
          ZIP_LIST=""
          for file in ./*.zip
          do
            full_path="kernel/${file#./}"
            ZIP_LIST+="$full_path"$'\n'
          done

          # 打印最终要上传的路径，方便排错
          echo "==== 待上传文件完整路径 ===="
          echo "$ZIP_LIST"

          # 多行写入环境变量
          echo "ZIP_FILES<<EOF" >> $GITHUB_ENV
          echo "$ZIP_LIST" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "RELEASE_TAG=LMI-Dual-Kernel-SukiSU-${{ github.sha }}" >> $GITHUB_ENV
          echo "RELEASE_TITLE=Redmi K30 Pro(lmi) AOSP+MIUI 双内核 SukiSU(KSU)" >> $GITHUB_ENV

      # 7. 发布Release上传刷机包
      - name: Publish GitHub Release Attach All Zips
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body: |
            # 构建信息
            - 设备机型：lmi (Redmi K30 Pro / POCO F2 Pro)
            - 编译模式：开启 SukiSU Ultra (KSU SUSFS + KPM)
            - 编译命令：bash build.sh lmi ksu
            - 工具链：proton-clang tag 20210522
            - 合并补丁：PR #56（仅README冲突自动修复）
            - 输出产物：
              1. Kernel_AOSP_*.zip 适配类原生/AOSP固件
              2. Kernel_MIUI_*.zip 适配原厂MIUI固件
            # 刷入说明
            TWRP / OrangeFox 直接卡刷对应版本刷机包
          files: ${{ env.ZIP_FILES }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: false
          prerelease: false
